<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#0F2557" />
      <stop offset="100%" stop-color="#071330" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Laurel Wreath (Left & Right) -->
  <g fill="url(#goldGrad)" opacity="0.95">
    <!-- Left Leaves -->
    <path d="M 120 220 C 100 200 90 160 115 130 C 120 160 135 180 145 200 Z" />
    <path d="M 95 270 C 70 250 65 210 90 180 C 95 210 110 230 120 250 Z" />
    <path d="M 85 320 C 60 300 55 260 80 230 C 88 260 102 280 112 300 Z" />
    <path d="M 95 370 C 70 355 70 315 95 285 C 102 315 115 335 125 355 Z" />
    <path d="M 120 415 C 95 405 100 365 125 340 C 130 370 145 385 155 405 Z" />
    <path d="M 160 450 C 135 445 145 405 170 385 C 175 410 190 425 200 440 Z" />

    <!-- Right Leaves -->
    <path d="M 380 220 C 400 200 410 160 385 130 C 380 160 365 180 355 200 Z" />
    <path d="M 405 270 C 430 250 435 210 410 180 C 405 210 390 230 380 250 Z" />
    <path d="M 415 320 C 440 300 445 260 420 230 C 412 260 398 280 388 300 Z" />
    <path d="M 405 370 C 430 355 430 315 405 285 C 398 315 385 335 375 355 Z" />
    <path d="M 380 415 C 405 405 400 365 375 340 C 370 370 355 385 345 405 Z" />
    <path d="M 340 450 C 365 445 355 405 330 385 C 325 410 310 425 300 440 Z" />
  </g>

  <!-- Outer Ring Gold Border -->
  <circle cx="250" cy="240" r="175" fill="#F59E0B" filter="url(#shadow)" />
  <circle cx="250" cy="240" r="168" fill="#FFFFFF" />

  <!-- Main Dark Blue Disk -->
  <circle cx="250" cy="240" r="160" fill="url(#blueGrad)" />

  <!-- Globe Meridian Grid Lines in background -->
  <g stroke="#3B82F6" stroke-width="1.5" fill="none" opacity="0.35">
    <ellipse cx="250" cy="240" rx="130" ry="130" />
    <ellipse cx="250" cy="240" rx="90" ry="130" />
    <ellipse cx="250" cy="240" rx="45" ry="130" />
    <line x1="120" y1="240" x2="380" y2="240" />
    <line x1="135" y1="190" x2="365" y2="190" />
    <line x1="135" y1="290" x2="365" y2="290" />
  </g>

  <!-- Arched Text: MODERN DELHI INFOTECH MADHEPURA -->
  <path id="textArc" d="M 115,240 A 135,135 0 1,1 385,240" fill="none" />
  <text font-family="'Poppins', 'Inter', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" letter-spacing="3.5">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">
      MODERN DELHI INFOTECH MADHEPURA
    </textPath>
  </text>

  <!-- Center Computer Monitor Graphic -->
  <g transform="translate(180, 165)" filter="url(#shadow)">
    <!-- Monitor Outer Body -->
    <rect x="0" y="0" width="140" height="96" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3" />
    <!-- Screen Bezel & Gradient Display -->
    <rect x="6" y="6" width="128" height="84" rx="4" fill="url(#screenGrad)" />
    <!-- Code / Data lines on screen -->
    <rect x="16" y="20" width="55" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="16" y="32" width="75" height="5" rx="2.5" fill="#FFFFFF" opacity="0.75" />
    <rect x="16" y="43" width="40" height="5" rx="2.5" fill="#FFFFFF" opacity="0.75" />
    <rect x="16" y="54" width="85" height="5" rx="2.5" fill="#FEF08A" opacity="0.9" />
    <circle cx="112" cy="30" r="12" fill="#FFFFFF" opacity="0.2" />

    <!-- Monitor Stand -->
    <path d="M 55 96 L 50 118 L 90 118 L 85 96 Z" fill="#94A3B8" />
    <rect x="40" y="118" width="60" height="8" rx="4" fill="#64748B" />

    <!-- Digital Growth Green Sprout / Leaf -->
    <g transform="translate(100, 75)">
      <path d="M 0 15 C 0 5 15 -5 22 -12 C 22 2 12 18 0 15 Z" fill="#10B981" />
      <path d="M -2 15 C -8 8 -5 -2 -14 -7 C -11 5 -4 14 -2 15 Z" fill="#34D399" />
      <path d="M 0 15 Q 1 20 2 24" stroke="#059669" stroke-width="2.5" fill="none" />
    </g>
  </g>

  <!-- 5 White Stars at bottom curve -->
  <g fill="#FFFFFF" transform="translate(0, 10)">
    <!-- Center star -->
    <polygon points="250,335 253,344 263,344 255,350 258,359 250,354 242,359 245,350 237,344 247,344" />
    <!-- Inner Left -->
    <polygon points="225,338 227.5,346 236,346 229,351 231.5,359 225,354.5 218.5,359 221,351 214,346 222.5,346" />
    <!-- Inner Right -->
    <polygon points="275,338 277.5,346 286,346 279,351 281.5,359 275,354.5 268.5,359 271,351 264,346 272.5,346" />
    <!-- Outer Left -->
    <polygon points="202,345 204,352 211,352 205.5,356.5 207.5,363.5 202,359.5 196.5,363.5 198.5,356.5 193,352 200,352" />
    <!-- Outer Right -->
    <polygon points="298,345 300,352 307,352 301.5,356.5 303.5,363.5 298,359.5 292.5,363.5 294.5,356.5 289,352 296,352" />
  </g>

  <!-- Ribbon at bottom: Regd. Govt. of India -->
  <g filter="url(#shadow)">
    <!-- Ribbon tails -->
    <polygon points="90,440 130,410 130,460 100,455" fill="#7F1D1D" />
    <polygon points="410,440 370,410 370,460 400,455" fill="#7F1D1D" />

    <!-- Ribbon main body -->
    <path d="M 110,432 C 180,415 320,415 390,432 L 380,465 C 310,448 190,448 120,465 Z" fill="url(#ribbonGrad)" stroke="#1E3A8A" stroke-width="2.5" />
    
    <!-- Text on Ribbon -->
    <text x="250" y="453" font-family="'Poppins', 'Inter', sans-serif" font-weight="800" font-size="19" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
      Regd. Govt. of India
    </text>
  </g>
</svg>
