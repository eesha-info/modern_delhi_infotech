# Builds the site on every push to main and publishes the built files to the
# `gh-pages` branch. GitHub Pages serves that branch.
#
# One-time setup: Settings → Pages → Build and deployment →
#   Source: "Deploy from a branch", Branch: gh-pages, Folder: / (root) → Save
#
# Why a separate branch: if Pages builds from `main`, GitHub publishes the raw
# source files (a blank page) and can overwrite the real build.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # Serve files as-is (skip Jekyll processing)
      - run: touch dist/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"
